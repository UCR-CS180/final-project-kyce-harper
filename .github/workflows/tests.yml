name: CI

on:
  push:
    branches: [main, mobile-frontend-ui]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Mocked tests — no secrets needed ────────────────────────────────
  unit-tests:
    name: Unit Tests (engine + interface)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run engine, interface, API, and storage unit tests
        run: pytest tests/engine/ tests/interface/ tests/api/ tests/storage/test_storage_unit.py -v

  # ── Job 2: Integration tests — requires GitHub secrets ────────────────────
  storage-tests:
    name: Integration Tests (storage → Google Sheets)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate SERVICE_ACCOUNT_JSON secret is set
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "ERROR: SERVICE_ACCOUNT_JSON secret is empty or not set in GitHub repo secrets."
            exit 1
          fi
          echo "Secret is set (${#SERVICE_ACCOUNT_JSON} chars)"

      - name: Write service_account.json from secret
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: python3 -c "import os; open('service_account.json', 'w').write(os.environ['SERVICE_ACCOUNT_JSON'])"

      - name: Write .env
        run: |
          echo "ANTHROPIC_API_KEY=ci-placeholder" > .env
          echo "SPREADSHEET_NAME=coach-notes" >> .env

      - name: Diagnose Google Sheets connection
        run: python3 diagnose_ci.py

      - name: Run storage integration tests
        run: pytest tests/storage/test_storage.py -v

  # ── Job 3: Flutter tests — no secrets needed ──────────────────────────────
  flutter-tests:
    name: Flutter Tests (widget + service)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test
