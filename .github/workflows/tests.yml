name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Mocked tests — no secrets needed ────────────────────────────────
  unit-tests:
    name: Unit Tests (engine + interface)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run engine and interface tests
        run: pytest tests/engine/ tests/interface/ -v

  # ── Job 2: Integration tests — requires GitHub secrets ────────────────────
  storage-tests:
    name: Integration Tests (storage → Google Sheets)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service_account.json from secret
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: python3 -c "import os; open('service_account.json', 'w').write(os.environ['SERVICE_ACCOUNT_JSON'])"

      - name: Write .env from secrets
        run: |
          echo "ANTHROPIC_API_KEY=ci-placeholder" > .env
          echo "SPREADSHEET_NAME=${{ secrets.SPREADSHEET_NAME }}" >> .env

      - name: Diagnose Google Sheets connection
        run: |
          python3 - <<'EOF'
          import json, os, traceback
          from dotenv import load_dotenv
          load_dotenv()

          print("=== Checking service_account.json ===")
          try:
              with open("service_account.json") as f:
                  data = json.load(f)
              print(f"  client_email : {data.get('client_email')}")
              print(f"  project_id   : {data.get('project_id')}")
              print("  JSON parsed OK")
          except Exception as e:
              print(f"  FAILED to parse JSON: {e}")
              traceback.print_exc()

          print("\n=== Checking SPREADSHEET_NAME ===")
          name = os.environ.get("SPREADSHEET_NAME", "(not set)")
          print(f"  SPREADSHEET_NAME = {name!r}")

          print("\n=== Connecting to Google Sheets ===")
          try:
              import gspread
              client = gspread.service_account(filename="service_account.json")
              ss = client.open(name)
              print(f"  Connected to: {ss.title!r}")
              print(f"  Worksheets  : {[ws.title for ws in ss.worksheets()]}")
          except Exception as e:
              print(f"  FAILED: {e}")
              traceback.print_exc()
          EOF

      - name: Run storage integration tests
        run: pytest tests/storage/ -v
